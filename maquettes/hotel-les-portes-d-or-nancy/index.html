  async function derive(pw){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b(SALT),iterations:ITER,hash:"SHA-256"},base,256));
  }
  async function open(raw){
    var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},key,b(CT));
    return new TextDecoder().decode(pt);
  }
  // On n'écrit la maquette qu'une fois la page d'attente entièrement chargée,
  // sinon le navigateur l'ajoute à la suite au lieu de la remplacer.
  function show(h){var go=function(){document.open();document.write(h);document.close();};if(document.readyState==="complete")setTimeout(go,0);else addEventListener("load",function(){setTimeout(go,0)},{once:true});}
  async function tryPw(pw){var raw=await derive(pw);var h=await open(raw);window.__pvk=raw;st(K,btoa(String.fromCharCode.apply(null,raw)));show(h);}
  var f=document.getElementById("f"),w=document.getElementById("w"),e=document.getElementById("e");
  function ask(){w.hidden=true;f.hidden=false;document.getElementById("pw").focus();}
  f.addEventListener("submit",function(ev){ev.preventDefault();e.textContent="Vérification…";tryPw(document.getElementById("pw").value.trim()).catch(function(){e.textContent="Code incorrect.";});});
  // Passé sa date de fin, la maquette ne s'ouvre plus, même avec la clé.
  var FIN=1799069400000;
  if(FIN&&Date.now()>FIN){w.hidden=true;document.getElementById("x").hidden=false;try{sessionStorage.removeItem(K)}catch(e){}return;}
  var saved=ld(K),h=decodeURIComponent(location.hash.slice(1));
  if(saved){open(b(saved)).then(function(x){window.__pvk=b(saved);show(x)}).catch(function(){h?tryPw(h).catch(ask):ask();});}
  else if(h){tryPw(h).catch(ask);}
  else ask();
})();
