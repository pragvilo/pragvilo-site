<script>(()=>{'use strict';const form=document.getElementById('unlock'),input=document.getElementById('password'),button=document.getElementById('open'),status=document.getElementById('status');const decode=value=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));form.addEventListener('submit',async event=>{event.preventDefault();if(button.disabled)return;let password=input.value;if(!password){status.textContent='Saisissez le mot de passe reçu.';input.focus();return;}button.disabled=true;status.textContent='Vérification du mot de passe…';input.value='';try{if(!globalThis.crypto?.subtle)throw Error('unavailable');const payload=JSON.parse(document.getElementById('encrypted-payload').textContent);const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);password='';const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:decode(payload.salt),iterations:payload.iterations},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),tagLength:128},key,decode(payload.ciphertext));const html=new TextDecoder('utf-8',{fatal:true}).decode(plain);document.open();document.write(html);document.close();}catch(error){password='';input.value='';button.disabled=false;status.textContent=globalThis.crypto?.subtle?'Mot de passe incorrect ou maquette endommagée. Réessayez.':'Ce navigateur ne permet pas le déchiffrement. Ouvrez cette page en HTTPS dans un navigateur récent.';input.focus();}});})();</script></body></html>
