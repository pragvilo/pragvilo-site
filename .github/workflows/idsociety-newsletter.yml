name: Newsletters ID Society
# Substack bloque les serveurs GitHub : la page est mise à jour ailleurs.
# Ici on redéploie Render dès que la page change sur main.
on:
  push:
    branches: [main]
    paths: [idsocietyclub/index.html]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redéploiement Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo "::error::Secret RENDER_DEPLOY_HOOK absent"; exit 1; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null && echo "Deploiement lance"
