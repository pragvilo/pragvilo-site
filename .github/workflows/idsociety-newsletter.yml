name: Newsletters ID Society
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: [idsocietyclub/index.html]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dernières newsletters
        id: maj
        run: |
          python3 scripts/update_idsociety_newsletter.py
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ID Society : dernières newsletters"
          git push
          echo "change=1" >> "$GITHUB_OUTPUT"
      - name: Redéploiement Render
        if: steps.maj.outputs.change == '1' || github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo "::error::Secret RENDER_DEPLOY_HOOK absent"; exit 1; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null && echo "Deploiement lance"
