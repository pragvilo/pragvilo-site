<title>Accès protégé</title>
<style>
:root{--bg:#1F262E;--fg:#F4F2EC;--mute:#A9B0B8;--acc:#FFC20E;--err:#FF8A7A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:360px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 20px;color:var(--mute);font-size:15px}
input{width:100%;padding:14px;border:1px solid #3A444F;border-radius:6px;background:#161B21;color:var(--fg);font-size:16px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:6px;background:var(--acc);color:#1F262E;font-weight:700;font-size:16px;cursor:pointer}
.err{color:var(--err);min-height:24px;margin-top:10px;font-size:14px}

  <button type="submit">Ouvrir la maquette</button>

  function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  function store(k,v){try{v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}
  function load(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
  async function open(raw){
    var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},key,b(CT));
    return new TextDecoder().decode(pt);
  }
  function show(html){document.open();document.write(html);document.close();}
  async function derive(pw){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b(SALT),iterations:ITER,hash:"SHA-256"},base,256));
  }
  var f=document.getElementById("f"), e=document.getElementById("e");
  var saved=load(KEY);
  // Attendre la fin du parsing : document.write ne remplace la page qu'une fois celle-ci chargée.
  document.addEventListener("DOMContentLoaded",function(){
    (saved?open(b(saved)):Promise.reject()).then(show,function(){
      store(KEY,null);f.hidden=false;document.getElementById("pw").focus();
    });
  });
  f.addEventListener("submit",async function(ev){
    ev.preventDefault();e.textContent="Vérification…";
    try{
      var raw=await derive(document.getElementById("pw").value);
      var html=await open(raw);
      store(KEY,btoa(String.fromCharCode.apply(null,raw)));
      show(html);
    }catch(x){e.textContent="Mot de passe incorrect.";}
  });
})();
